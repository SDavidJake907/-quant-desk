[project]
name = "stock-scanner"
version = "0.1.0"
description = "Deterministic-first equity scanner with a local Gemma 3 analyst layer"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dateutil>=2.9",
    "defusedxml>=0.7",
    # Windows ships no IANA tz database; zoneinfo needs this to resolve
    # "Asia/Tokyo", "Europe/London" etc.
    "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
