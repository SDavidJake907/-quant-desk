[project]
name = "quant-desk"
version = "0.1.0"
description = "Quant-desk: a paper-trading competition between the operator and Gemma, a local AI trader, on US stocks"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dateutil>=2.9",
    "defusedxml>=0.7",
    # Read-only dashboard (src/scanner/web): GET endpoints only, 127.0.0.1
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Windows ships no IANA tz database; zoneinfo needs this to resolve
    # "Asia/Tokyo", "Europe/London" etc.
    "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
